<div class="app-container">
      <nav class="sidebar" [class.collapsed]="isSidebarCollapsed">
        <button class="sidebar-toggle" (click)="toggleSidebar()">
          <fa-icon [icon]="isSidebarCollapsed ? faBars : faTimes"></fa-icon>
        </button>
        
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
          <i class="fas fa-chart-line"></i>
          <span *ngIf="!isSidebarCollapsed">Dashboard</span>
        </a>
        
        <a routerLink="/customers" routerLinkActive="active" class="nav-item">
          <i class="fas fa-users"></i>
          <span *ngIf="!isSidebarCollapsed">Customers</span>
        </a>
        
        <a routerLink="/loans" routerLinkActive="active" class="nav-item">
          <i class="fas fa-money-bill-wave"></i>
          <span *ngIf="!isSidebarCollapsed">Loans</span>
        </a>
        
        <a routerLink="/repayments-schedule" routerLinkActive="active" class="nav-item">
          <i class="fas fa-calendar-alt"></i>
          <span *ngIf="!isSidebarCollapsed">Repayment Schedule</span>
        </a>
        
        <a routerLink="/admins" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-shield"></i>
          <span *ngIf="!isSidebarCollapsed">Admins</span>
        </a>
        
        <a routerLink="/profile" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span *ngIf="!isSidebarCollapsed">Profile</span>
        </a>
        
        <a routerLink="/repayments" routerLinkActive="active" class="nav-item">
          <i class="fas fa-hand-holding-usd"></i>
          <span *ngIf="!isSidebarCollapsed">Repayment</span>
        </a>
      </nav>

      <div class="main-content">
        <app-header></app-header>
        
        <router-outlet></router-outlet>
      </div>
    </div>
